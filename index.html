<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BarTrack" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BarTrack" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Bar Track — Operations, Stock Audit & Reconciliation System</title>
    <meta name="description" content="Bar operations management and sales reconciliation system featuring shift transitions, physical stock counts, M-Pesa and cash float tracking, and owner oversight." />
    <meta property="og:title" content="Bar Track — Operations, Stock Audit & Reconciliation System" />
    <meta property="og:description" content="Bar operations management and sales reconciliation system featuring shift transitions, physical stock counts, M-Pesa and cash float tracking, and owner oversight." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        window.__appMounted = false;

        window.__renderStartupRecovery = function(errMsg) {
          if (window.__appMounted) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '' +
            '<div style="min-height: 100vh; background-color: #0A0D14; color: #F1F5F9; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; font-family: system-ui, -apple-system, sans-serif; text-align: center;">' +
              '<div style="max-width: 400px; width: 100%; background: #141A26; border: 1px solid #232C3F; border-radius: 20px; padding: 28px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">' +
                '<div style="width: 48px; height: 48px; border-radius: 14px; background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; color: #fb7185; font-size: 20px; font-weight: 800;">' +
                  '!' +
                '</div>' +
                '<h2 style="font-size: 18px; font-weight: 800; color: #ffffff; margin: 0 0 8px 0; letter-spacing: -0.02em;">System Recovery</h2>' +
                '<p style="font-size: 13px; color: #94A3B8; margin: 0 0 18px 0; line-height: 1.5;">' +
                  'The application caught a startup issue. Tap below to reload fresh or clean stored cache.' +
                '</p>' +
                (errMsg ? '<div style="font-family: monospace; font-size: 11px; color: #fb7185; background: #1B2333; border: 1px solid #323E58; border-radius: 10px; padding: 10px; margin-bottom: 18px; word-break: break-all; max-height: 80px; overflow-y: auto; text-align: left;">' + String(errMsg) + '</div>' : '') +
                '<div style="display: flex; flex-direction: column; gap: 10px;">' +
                  '<button id="__recReloadBtn" style="width: 100%; padding: 12px; background: #10B981; color: #022C22; border: none; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer;">' +
                    'Reload Application' +
                  '</button>' +
                  '<button id="__recResetBtn" style="width: 100%; padding: 12px; background: #1B2333; color: #F1F5F9; border: 1px solid #323E58; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer;">' +
                    'Clean Cache & Safe Restart' +
                  '</button>' +
                '</div>' +
              '</div>' +
            '</div>';

          var rBtn = document.getElementById('__recReloadBtn');
          if (rBtn) {
            rBtn.onclick = function() { window.location.reload(); };
          }
          var cBtn = document.getElementById('__recResetBtn');
          if (cBtn) {
            cBtn.onclick = function() {
              try {
                var s = localStorage.getItem('bartracker_active_session');
                var u = localStorage.getItem('bartracker_session_user');
                var b = localStorage.getItem('bar_track_current_biz_id');
                var q = localStorage.getItem('bar_track_offline_queue');

                localStorage.clear();
                sessionStorage.clear();

                if (s) localStorage.setItem('bartracker_active_session', s);
                if (u) localStorage.setItem('bartracker_session_user', u);
                if (b) localStorage.setItem('bar_track_current_biz_id', b);
                if (q) localStorage.setItem('bar_track_offline_queue', q);

                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    regs.forEach(function(r) { r.unregister(); });
                  });
                }
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    names.forEach(function(name) { caches.delete(name); });
                  });
                }
              } catch (e) {}
              window.location.reload();
            };
          }
        };

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || '';
          if (typeof msg === 'string' && (
            msg.includes('WebSocket') ||
            msg.includes('closed without opened') ||
            msg.includes('@vite/client') ||
            msg.includes('ResizeObserver') ||
            msg.includes('Script error')
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return;
          }
          if (!window.__appMounted) {
            window.__renderStartupRecovery(msg);
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonMsg = event.reason ? (event.reason.message || String(event.reason)) : '';
          if (typeof reasonMsg === 'string' && (
            reasonMsg.includes('WebSocket') ||
            reasonMsg.includes('closed without opened') ||
            reasonMsg.includes('@vite/client') ||
            reasonMsg.includes('Missing or insufficient permissions') ||
            reasonMsg.includes('offline')
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return;
          }
          if (!window.__appMounted) {
            window.__renderStartupRecovery(reasonMsg);
          }
        }, true);

        setTimeout(function() {
          if (!window.__appMounted) {
            var root = document.getElementById('root');
            if (root && root.innerText && root.innerText.includes('Loading Bar Operations')) {
              window.__renderStartupRecovery('Startup took longer than expected.');
            }
          }
        }, 20000);
      })();
    </script>
  </head>
  <body style="margin: 0; padding: 0; background-color: #0A0D14; color: #F1F5F9; min-height: 100vh; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;">
    <div id="root">
      <div style="min-height: 100vh; background-color: #0A0D14; color: #F1F5F9; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 52px; height: 52px; border-radius: 14px; background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.3); display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
          <svg style="width: 24px; height: 24px; color: #10B981; animation: spin 1.4s linear infinite;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v3m0 12v3m9-9h-3M6 12H3m15.364 6.364l-2.121-2.121M8.757 8.757L6.636 6.636m11.728 0l-2.121 2.121M8.757 15.243l-2.121 2.121" />
          </svg>
        </div>
        <h2 style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #F1F5F9; margin: 0 0 4px 0;">Bar Track</h2>
        <p style="font-size: 13px; color: #94A3B8; margin: 0;">Loading Bar Operations & Stock System...</p>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
