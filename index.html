<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BarTrack" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BarTrack" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Bar Track — Operations, Stock Audit & Reconciliation System</title>
    <meta name="description" content="Bar operations management and sales reconciliation system featuring shift transitions, physical stock counts, M-Pesa and cash float tracking, and owner oversight." />
    <meta property="og:title" content="Bar Track — Operations, Stock Audit & Reconciliation System" />
    <meta property="og:description" content="Bar operations management and sales reconciliation system featuring shift transitions, physical stock counts, M-Pesa and cash float tracking, and owner oversight." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        window.__appMounted = false;

        window.__renderStartupRecovery = function(errMsg) {
          if (window.__appMounted) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '' +
            '<div style="min-height: 100vh; background-color: #0a0a0f; color: #ececf3; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; font-family: system-ui, -apple-system, sans-serif; text-align: center;">' +
              '<div style="max-width: 400px; width: 100%; background: #14141d; border: 1px solid #262633; border-radius: 24px; padding: 28px 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">' +
                '<div style="width: 48px; height: 48px; border-radius: 14px; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; color: #f87171; font-size: 22px;">' +
                  '⚠️' +
                '</div>' +
                '<h2 style="font-size: 18px; font-weight: 800; color: #ffffff; margin: 0 0 8px 0; letter-spacing: -0.02em;">System Recovery</h2>' +
                '<p style="font-size: 13px; color: #9a9aae; margin: 0 0 18px 0; line-height: 1.5;">' +
                  'The application caught a startup issue. Tap below to reload fresh or clean stored cache.' +
                '</p>' +
                (errMsg ? '<div style="font-family: monospace; font-size: 11px; color: #fb7185; background: #1a1a25; border: 1px solid #35354a; border-radius: 10px; padding: 10px; margin-bottom: 18px; word-break: break-all; max-height: 80px; overflow-y: auto; text-align: left;">' + String(errMsg) + '</div>' : '') +
                '<div style="display: flex; flex-direction: column; gap: 10px;">' +
                  '<button id="__recReloadBtn" style="width: 100%; padding: 12px; background: #10b981; color: #022c22; border: none; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer;">' +
                    'Reload Application' +
                  '</button>' +
                  '<button id="__recResetBtn" style="width: 100%; padding: 12px; background: #1e1e29; color: #ececf3; border: 1px solid #35354a; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer;">' +
                    'Clean Cache & Safe Restart' +
                  '</button>' +
                '</div>' +
              '</div>' +
            '</div>';

          var rBtn = document.getElementById('__recReloadBtn');
          if (rBtn) {
            rBtn.onclick = function() { window.location.reload(); };
          }
          var cBtn = document.getElementById('__recResetBtn');
          if (cBtn) {
            cBtn.onclick = function() {
              try {
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    regs.forEach(function(r) { r.unregister(); });
                  });
                }
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    names.forEach(function(name) { caches.delete(name); });
                  });
                }
                sessionStorage.clear();
              } catch (e) {}
              window.location.reload();
            };
          }
        };

        window.addEventListener('error', function(event) {
          if (!window.__appMounted) {
            var msg = event.message || (event.error && event.error.message);
            if (msg && (msg.includes('ResizeObserver') || msg.includes('Script error'))) return;
            window.__renderStartupRecovery(msg);
          }
        });

        window.addEventListener('unhandledrejection', function(event) {
          if (!window.__appMounted) {
            var reasonMsg = event.reason ? (event.reason.message || String(event.reason)) : '';
            if (reasonMsg.includes('Missing or insufficient permissions') || reasonMsg.includes('offline')) {
              return;
            }
            window.__renderStartupRecovery(reasonMsg);
          }
        });

        setTimeout(function() {
          if (!window.__appMounted) {
            var root = document.getElementById('root');
            if (root && root.innerText && root.innerText.includes('Loading Bar Operations')) {
              window.__renderStartupRecovery('Startup took longer than expected.');
            }
          }
        }, 9000);
      })();
    </script>
  </head>
  <body style="margin: 0; padding: 0; background-color: #0a0a0f; color: #ececf3; min-height: 100vh; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;">
    <div id="root">
      <div style="min-height: 100vh; background-color: #0a0a0f; color: #ececf3; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.3); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 8px 24px -8px rgba(139, 92, 246, 0.4);">
          <svg style="width: 28px; height: 28px; color: #a78bfa; animation: spin 1.5s linear infinite;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
          </svg>
        </div>
        <h2 style="font-size: 18px; font-weight: 800; letter-spacing: -0.025em; color: #ffffff; margin: 0 0 4px 0;">Bar Track</h2>
        <p style="font-size: 13px; color: #9a9aae; margin: 0;">Loading Bar Operations & Stock System...</p>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
