<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Inner ambient ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />

  <!-- Stylized Bar Shaker / Ledger Bottle Emblem -->
  <!-- Center Hexagon / Shield Backdrop -->
  <path d="M256 100 L370 166 L370 298 L256 364 L142 298 L142 166 Z" fill="#131B2E" stroke="#334155" stroke-width="3" />

  <!-- Accent glow line -->
  <path d="M256 120 L350 176 L350 288 L256 344 L162 288 L162 176 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" filter="url(#glow)" opacity="0.8" />

  <!-- Cocktail / Bottle Silhouette -->
  <!-- Bottle Neck -->
  <rect x="242" y="148" width="28" height="42" rx="4" fill="url(#cyanGrad)" />
  <rect x="238" y="142" width="36" height="10" rx="3" fill="#E2E8F0" />

  <!-- Bottle Body -->
  <path d="M236 190 C220 206 210 226 210 252 L210 306 C210 312 214 316 220 316 L292 316 C298 316 302 312 302 306 L302 252 C302 226 292 206 276 190 Z" fill="url(#emeraldGrad)" />

  <!-- Liquid level & highlight -->
  <path d="M216 260 C236 266 276 254 296 260 L296 308 C296 311 293 313 290 313 L222 313 C219 313 216 311 216 308 Z" fill="#10B981" opacity="0.9" />

  <!-- Chart / Stock Reconcile bars overlay -->
  <rect x="228" y="278" width="8" height="26" rx="2" fill="#FFFFFF" opacity="0.9" />
  <rect x="242" y="268" width="8" height="36" rx="2" fill="#FFFFFF" opacity="0.9" />
  <rect x="256" y="260" width="8" height="44" rx="2" fill="#FFFFFF" opacity="0.9" />
  <rect x="270" y="272" width="8" height="32" rx="2" fill="#FFFFFF" opacity="0.9" />

  <!-- Text Wordmark at bottom -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">BAR TRACK</text>
  <text x="256" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#10B981" text-anchor="middle" letter-spacing="2">OPERATIONS · AUDIT</text>
</svg>
